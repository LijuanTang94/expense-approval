# Production stack for a single always-on VM (e.g. Oracle Cloud Always-Free ARM).
# Runs the app + its own Postgres + Caddy (automatic HTTPS via Let's Encrypt).
# Values come from a .env file next to this one (see DEPLOY-oracle.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: expense
    volumes:
      - expense_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: ..          # the project root, where the Dockerfile lives
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/expense
      DB_USER: expense
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      SERVER_PORT: "8081"
      # Cap the heap so the JVM can't balloon past the container limit below.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
    restart: unless-stopped
    # The free-tier VM is small and shared with Postgres and Caddy; without limits one runaway
    # container can starve the others.
    mem_limit: 768m
    cpus: 1.0

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # e.g. 140-238-1-2.sslip.io  (dashes = your VM's public IP; sslip.io resolves it for free)
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  expense_pg:
  caddy_data:
  caddy_config:
