services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense
    ports:
      - "5433:5432" # 5433 on the host to avoid clashing with other local Postgres instances
    volumes:
      - expense_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense"]
      interval: 3s
      timeout: 3s
      retries: 10

  # The full app (Spring Boot serving the built React SPA) — `docker compose up` runs everything.
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/expense
      DB_USER: expense
      DB_PASSWORD: expense
      APP_JWT_SECRET: local-compose-secret-change-me-32bytes-minimum
      SERVER_PORT: "8081"
    ports:
      - "8081:8081"

volumes:
  expense_pg:
