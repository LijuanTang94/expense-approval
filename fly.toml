app = 'expense-approval-demo'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  SERVER_PORT = '8081'

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
