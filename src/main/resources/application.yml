spring:
  application:
    name: expense-approval
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/expense}
    username: ${DB_USER:expense}
    password: ${DB_PASSWORD:expense}
  jpa:
    hibernate:
      # Flyway owns the schema (versioned SQL migrations); Hibernate never modifies it. "validate"
      # (rather than "none") makes it check the entities against the real tables at startup, so
      # schema drift fails fast at boot instead of surfacing as a runtime error mid-request.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

# App-specific auth config. APP_JWT_SECRET must be set in any real deployment.
app:
  jwt:
    # HS256 secret — must be at least 32 bytes. Deliberately has NO checked-in default: a
    # committed fallback secret is a public signing key, so anyone could forge tokens for any
    # role. Left blank, JwtService generates a random dev key at startup (see the warning it logs).
    secret: ${APP_JWT_SECRET:}
    # Access-token lifetime in minutes.
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:120}

# Only /actuator/health is exposed (the container healthcheck uses it). The other actuator
# endpoints — env, beans, configprops, heapdump — would leak configuration and internals.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.springframework.security: INFO
